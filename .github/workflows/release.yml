name: Release Extension

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate changelog version
        run: node scripts/extract-release-notes.js "${{ github.ref_name }}" > /tmp/release-notes.md

      - name: Build zip package
        run: npm run bv -- ${{ github.ref_name }} --zip

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'content<<EOF'
            cat /tmp/release-notes.md
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.content }}
          files: output/new-tab-bookmarker_v${{ github.ref_name }}.zip
