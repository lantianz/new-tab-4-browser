<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Chrome Extension</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        --thumb-color: transparent;
      }

      *:hover {
        --thumb-color: #dbdbdb;
      }

      *::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      *::-webkit-scrollbar-thumb {
        border-radius: 0;
        background: var(--thumb-color);
      }

      *::-webkit-scrollbar-thumb:hover {
        background: #dbdbdb;
      }

      *::-webkit-scrollbar-track {
        border-radius: 0;
        background: transparent;
      }

      *::-webkit-scrollbar-corner {
        background: rgba(0, 0, 0, 0);
      }

      html {
        width: 360px;
        height: 400px;
      }

      body {
        width: 360px;
        height: 400px;
        margin: auto;
        padding: 0;
        font-family: Consolas, 'PingFang SC Regular', 'PingFang SC',
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="./src/popup.js"></script>
  </body>
</html>
